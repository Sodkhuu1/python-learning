<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Mongo App</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        max-width: 480px;
        margin: 40px auto;
      }

      h1 {
        font-size: 24px;
      }

      form {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      input[type="text"] {
        flex: 1;
        padding: 8px;
      }

      button {
        padding: 8px 16px;
        cursor: pointer;
      }

      ul {
        list-style: none;
        padding-left: 0;
      }

      li {
        padding: 4px 0;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <h1>Simple Mongo App (Vercel + Railway)</h1>

    <form id="item-form">
      <input
        type="text"
        id="text-input"
        placeholder="Write something..."
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="items-list"></ul>

    <script>
      // ЭНД Railway backend URL-ээ тавина:
      const BACKEND_URL = "https://python-learning-production-c449.up.railway.app";

      const form = document.getElementById("item-form");
      const input = document.getElementById("text-input");
      const list = document.getElementById("items-list");

      async function loadItems() {
        const res = await fetch(`${BACKEND_URL}/api/items`);
        const data = await res.json();

        list.innerHTML = "";
        data.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item.text;
          list.appendChild(li);
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        await fetch(`${BACKEND_URL}/api/items`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ text }),
        });

        input.value = "";
        await loadItems();
      });

      loadItems();
    </script>
  </body>
</html>
